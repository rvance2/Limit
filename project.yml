name: Limit
options:
  bundleIdPrefix: com.rowanvance
  deploymentTarget:
    iOS: "17.0"
targets:
  Limit:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Seeds/**"
          - "Resources/Vault/**"
      - path: Sources/Resources/Seeds
        type: folder
        buildPhase: resources
      - path: Sources/Resources/Vault
        type: folder
        buildPhase: resources
      - path: Shared
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: "My session readiness requires reading resting heart rate, HRV, and sleep data."
        NSHealthUpdateUsageDescription: "My session readiness requires writing health data."
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.rowanvance.Limit
            CFBundleURLSchemes: [limit]
    entitlements:
      path: Limit.entitlements
      properties:
        # Base HealthKit only — no `.access` (Health Records) or `.background-delivery`,
        # both of which personal/free development teams can't provision. The app only ever
        # does foreground HKSampleQuery reads (HRV, resting HR, sleep) from the morning
        # survey, so neither is needed.
        com.apple.developer.healthkit: true
    dependencies:
      - target: LimitWidget
  LimitWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rowanvance.Limit.LimitWidget
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LimitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LimitTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Limit
schemes:
  Limit:
    build:
      targets:
        Limit: all
        LimitTests: [test]
    test:
      targets:
        - LimitTests
